<!doctype html>
<html lang="ko" data-aos-v3>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>퀵메뉴 시안 10종</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--p:#376CB2;--pd:#2C5A96;--navy:#16304F;--bg:#F4F8FD;--k:#FEE500}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,system-ui,sans-serif;background:#E9EEF5;color:#222;padding:48px 20px 80px}
a{text-decoration:none;color:inherit}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:32px;font-weight:800;margin-bottom:8px}
.lead{color:#555;margin-bottom:36px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(22,48,79,.08)}
.card-h{display:flex;align-items:baseline;gap:12px;padding:20px 24px}
.card-h b{font-size:15px;color:var(--p);font-weight:800}
.card-h h2{font-size:19px;font-weight:700}
.card-h p{margin-left:auto;font-size:13px;color:#888}
/* 가짜 페이지 */
.stage{position:relative;height:440px;background:linear-gradient(180deg,#fff,#EEF3FA);overflow:hidden;border-top:1px solid #eef1f5}
.stage::before{content:'';position:absolute;left:28px;top:32px;width:46%;height:22px;border-radius:6px;background:#dfe6ef;box-shadow:0 40px 0 -4px #e8edf4,0 74px 0 -4px #e8edf4,0 108px 0 -4px #e8edf4}
.stage::after{content:'';position:absolute;left:28px;top:200px;width:60%;height:190px;border-radius:16px;background:#dfe6ef}
.qm{position:absolute;right:20px;bottom:24px;z-index:2}
.ic{width:22px;height:22px;flex:none;display:block}
.desc{padding:14px 24px 22px;font-size:14px;color:#555;line-height:1.6}

/* 01 흰 캡슐 세로바 */
.v1{display:flex;flex-direction:column;background:#fff;border-radius:40px;padding:8px;box-shadow:0 10px 30px rgba(22,48,79,.16)}
.v1 a{width:64px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#333;border-radius:32px;transition:.2s}
.v1>*+*{border-top:1px solid #eef1f5}
.v1 a:hover{background:var(--bg);color:var(--p)}
.v1 .ic{color:var(--p)}

/* 02 브랜드 블루 캡슐 */
.v2{display:flex;flex-direction:column;background:var(--p);border-radius:40px;padding:6px;box-shadow:0 10px 30px rgba(55,108,178,.4)}
.v2 a{width:62px;padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#fff;border-radius:30px;transition:.2s}
.v2>*+*{border-top:1px solid rgba(255,255,255,.2)}
.v2 a:hover{background:rgba(255,255,255,.15)}

/* 03 흰 원형 + 호버 라벨 */
.v3{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.v3 a{position:relative;width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--p);box-shadow:0 8px 22px rgba(22,48,79,.16);transition:.2s}
.v3 a span{position:absolute;right:68px;top:50%;transform:translate(8px,-50%);opacity:0;white-space:nowrap;background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;transition:.2s;pointer-events:none}
.v3 a:hover{background:var(--p);color:#fff}
.v3 a:hover span,.v3 a.show span{opacity:1;transform:translate(0,-50%)}

/* 04 채널 컬러 라운드 타일 */
.v4{display:flex;flex-direction:column;gap:10px}
.v4 a{width:68px;height:68px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.12);transition:transform .2s}
.v4 a:hover{transform:translateY(-3px)}
.v4 .sns{background:linear-gradient(135deg,#F58529,#DD2A7B 55%,#8134AF);color:#fff}
.v4 .tel{background:var(--p);color:#fff}
.v4 .kk{background:var(--k);color:#3A1D1D}

/* 05 카카오 강조형 */
.v5{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.v5 .sm{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;box-shadow:0 6px 18px rgba(22,48,79,.14)}
.v5 .big{display:flex;align-items:center;gap:10px;height:60px;padding:0 22px 0 18px;border-radius:30px;background:var(--k);color:#3A1D1D;font-weight:800;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.16)}
.v5 .big .ic{width:26px;height:26px}

/* 06 FAB 펼침형 */
.v6{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.v6 .items{display:flex;flex-direction:column;gap:10px;align-items:flex-end;transition:.25s}
.v6:not(.open) .items{opacity:0;transform:translateY(12px);pointer-events:none}
.v6 .items a{display:flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 14px;border-radius:23px;background:#fff;font-size:14px;font-weight:600;color:#333;box-shadow:0 6px 18px rgba(22,48,79,.14)}
.v6 .items .ic{color:var(--p);width:20px;height:20px}
.v6 button{width:62px;height:62px;border:0;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px rgba(55,108,178,.45);transition:transform .25s}
.v6.open button{transform:rotate(45deg);background:var(--navy)}
.v6 button .ic{width:28px;height:28px}

/* 07 우측 엣지 탭 */
.stage .v7{right:0;bottom:auto;top:50%;transform:translateY(-50%)}
.v7{display:flex;flex-direction:column;background:var(--navy);border-radius:16px 0 0 16px;overflow:hidden;box-shadow:-6px 8px 24px rgba(22,48,79,.25)}
.v7 a{width:74px;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11px;font-weight:600;transition:.2s}
.v7>*+*{border-top:1px solid rgba(255,255,255,.12)}
.v7 a:hover{background:var(--p)}
.v7 .kk{color:var(--k)}

/* 08 글래스 */
.stage.photo{background:url(assets/photos/06cf0d.jpg) center/cover}
.stage.photo::before,.stage.photo::after{display:none}
.v8{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:24px;background:rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.45);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.v8 a{width:60px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:16px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3);transition:.2s}
.v8 a:hover{background:rgba(255,255,255,.25)}

/* 09 가로 알약 */
.v9{display:flex;align-items:center;gap:4px;padding:6px;border-radius:40px;background:#fff;box-shadow:0 10px 30px rgba(22,48,79,.18)}
.v9 .lbl{padding:0 14px 0 12px;font-size:14px;font-weight:800;color:var(--navy);white-space:nowrap}
.v9 a{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;transition:.2s}
.v9 .sns{background:var(--bg);color:var(--p)}
.v9 .tel{background:var(--p);color:#fff}
.v9 .kk{background:var(--k);color:#3A1D1D}
.v9 a:hover{transform:scale(1.08)}

/* 10 아웃라인 미니멀 */
.v10{display:flex;flex-direction:column;gap:14px;align-items:center}
.v10 a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#333}
.v10 a i{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--p);background:#fff;color:var(--p);display:grid;place-items:center;transition:.2s}
.v10 a:hover i{background:var(--p);color:#fff}

/* SNS 펼침 목록 (공통) */
.snsl{position:absolute;right:calc(100% + 12px);top:0;background:#fff;border-radius:14px;padding:8px;box-shadow:0 10px 28px rgba(22,48,79,.16);white-space:nowrap;display:none;color:#333}
.snsl a{display:block!important;width:auto!important;height:auto!important;padding:8px 14px!important;font-size:13px!important;font-weight:500!important;color:#333!important;background:none!important;border:0!important;box-shadow:none!important;border-radius:8px!important;text-shadow:none!important}
.snsl a:hover{background:var(--bg)!important;color:var(--p)!important}
.has-sns{position:relative}
.has-sns.open>.snsl{display:block}
</style>
</head>
<body>
<div class="wrap">
<h1>퀵메뉴 시안 10종</h1>
<p class="lead">지금 퀵메뉴와 같은 SNS 바로가기 · 전화 · 카카오톡 3개로 만든 시안입니다. 마우스를 올리면 호버 효과를 볼 수 있고, SNS 버튼을 누르면 채널 목록이 열립니다.<br>마음에 드는 번호를 알려주시면 전체 페이지에 적용합니다.</p>

<svg width="0" height="0" style="position:absolute">
<symbol id="i-sns" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
<symbol id="i-tel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
<symbol id="i-kk" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.2 4.7 6.6l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.5 10-7.9S17.5 3 12 3z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<div class="grid" id="grid"></div>
</div>
<script>
const SNS=[['남중진뉴스','https://www.youtube.com/@taekwonrope'],['점핑클럽 유튜브','https://www.youtube.com/channel/UCbnmgNXFGJ7lGdY2aXkTPRQ?view_as=subscriber'],['인스타그램','https://www.instagram.com/jumpingclub_official'],['블로그','https://blog.naver.com/skql_22'],['밴드','https://www.band.us/@musicrope']];
const list='<div class="snsl">'+SNS.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('')+'</div>';
const I=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const V=[
['흰 캡슐 세로바','아이콘+라벨을 흰 캡슐 하나로 묶은 기본형. 어느 배경에도 무난합니다.',
 `<div class="qm v1"><a href="#" data-sns>${I('sns')}SNS</a><a href="tel:070-7703-7713">${I('tel')}전화</a><a href="#">${I('kk')}카카오톡</a></div>`],
['브랜드 블루 캡슐','1번과 같은 구조를 브랜드 컬러로 채운 버전. 눈에 잘 띕니다.',
 `<div class="qm v2"><a href="#" data-sns>${I('sns')}SNS</a><a href="tel:070-7703-7713">${I('tel')}전화</a><a href="#">${I('kk')}카카오톡</a></div>`],
['흰 원형 + 호버 라벨','평소엔 아이콘만, 마우스를 올리면 왼쪽에 이름이 나옵니다. 가장 깔끔한 형태.',
 `<div class="qm v3"><a href="#" data-sns>${I('sns')}<span>SNS 바로가기</span></a><a href="tel:070-7703-7713">${I('tel')}<span>전화 상담 070-7703-7713</span></a><a href="#">${I('kk')}<span>카카오톡 상담</span></a></div>`],
['채널 컬러 타일','SNS·전화·카카오톡을 각 채널 색으로 구분한 라운드 사각 타일.',
 `<div class="qm v4"><a href="#" class="sns" data-sns>${I('sns')}SNS</a><a href="tel:070-7703-7713" class="tel">${I('tel')}전화</a><a href="#" class="kk">${I('kk')}카카오톡</a></div>`],
['카카오톡 강조형','상담 전환이 가장 많은 카카오톡을 크게, 나머지는 작은 원으로.',
 `<div class="qm v5"><a href="#" class="sm" data-sns>${I('sns')}</a><a href="tel:070-7703-7713" class="sm">${I('tel')}</a><a href="#" class="big">${I('kk')}카카오톡 상담</a></div>`],
['플로팅 버튼 펼침형','버튼 하나만 두고 누르면 메뉴가 펼쳐집니다. 화면을 가장 적게 가립니다. (버튼을 눌러 보세요)',
 `<div class="qm v6 open"><div class="items"><a href="#" data-sns>${I('sns')}SNS 바로가기</a><a href="tel:070-7703-7713">${I('tel')}전화 상담</a><a href="#">${I('kk')}카카오톡 상담</a></div><button type="button" aria-label="퀵메뉴 열기" onclick="this.parentNode.classList.toggle('open')">${I('plus')}</button></div>`],
['우측 엣지 탭','화면 오른쪽 가장자리에 붙는 네이비 탭. 공공기관·협회 사이트에서 많이 쓰는 형태.',
 `<div class="qm v7"><a href="#" data-sns>${I('sns')}SNS</a><a href="tel:070-7703-7713">${I('tel')}전화</a><a href="#" class="kk">${I('kk')}<span style="color:#fff">카카오톡</span></a></div>`],
['글래스 (반투명)','사진 위에서도 자연스러운 반투명 유리 효과. 히어로·사진 섹션과 잘 어울립니다.',
 `<div class="qm v8"><a href="#" data-sns>${I('sns')}SNS</a><a href="tel:070-7703-7713">${I('tel')}전화</a><a href="#">${I('kk')}카카오톡</a></div>`,'photo'],
['가로 알약형','"상담 문의" 문구와 아이콘 3개를 가로 한 줄로. 하단 고정바와 함께 쓰기 좋습니다.',
 `<div class="qm v9"><span class="lbl">상담 문의</span><a href="#" class="sns" data-sns aria-label="SNS">${I('sns')}</a><a href="tel:070-7703-7713" class="tel" aria-label="전화">${I('tel')}</a><a href="#" class="kk" aria-label="카카오톡">${I('kk')}</a></div>`],
['아웃라인 미니멀','얇은 테두리 원 + 아래 라벨. 가볍고 정돈된 느낌.',
 `<div class="qm v10"><a href="#" data-sns><i>${I('sns')}</i>SNS</a><a href="tel:070-7703-7713"><i>${I('tel')}</i>전화</a><a href="#"><i>${I('kk')}</i>카카오톡</a></div>`],
];
document.getElementById('grid').innerHTML=V.map(([t,d,h,cls],i)=>`<div class="card"><div class="card-h"><b>${String(i+1).padStart(2,'0')}</b><h2>${t}</h2></div><div class="stage ${cls||''}">${h}</div><p class="desc">${d}</p></div>`).join('');
// SNS 목록: 각 SNS 버튼 옆에 펼침
document.querySelectorAll('[data-sns]').forEach(a=>{const w=document.createElement('span');w.className='has-sns';w.style.position='relative';w.style.display='block';a.parentNode.insertBefore(w,a);w.appendChild(a);w.insertAdjacentHTML('beforeend',list);a.addEventListener('click',e=>{e.preventDefault();w.classList.toggle('open')})});
document.querySelectorAll('a[href="#"]:not([data-sns])').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
</script>
</body>
</html>
